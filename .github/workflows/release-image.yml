name: Build Docker image and Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "仅允许 v1.2.3 或 v1.2.3-rc.1 格式的标签"
            exit 1
          fi
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "stable=$([[ $prerelease == false ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/meloark
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          release_args=(
            "${GITHUB_REF_NAME}"
            compose.yaml
            compose.production.yaml
            .env.example
            .env.production.example
            LICENSE
            THIRD_PARTY_NOTICES.md
            --verify-tag
            --generate-notes
            --title "MeloArk ${GITHUB_REF_NAME}"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"
