[package]
name = "meloark-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
aes-gcm = "0.10.3"
async-stream = "0.3.6"
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
base64 = "0.22.1"
blake3 = "1.8.3"
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["t2s-conversion"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
md5 = "0.8.0"
lofty = "0.25.0"
notify = "8.2.0"
pinyin = { version = "0.11.0", default-features = false, features = ["plain"] }
regex = "1.12.4"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
strsim = "0.11.1"
subtle = "2.6.1"
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
url = "2.5.8"
walkdir = "2.5.0"
yaml_serde = "0.10.4"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
